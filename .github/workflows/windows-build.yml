name: Windows Portable Build

# Temporarily manual-only: GitHub is currently failing these jobs before a runner
# starts (runner_id=0 / zero steps), so push-triggered builds only create misleading
# red checks. The workflow remains ready to dispatch when runner availability returns.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64
        run: dotnet restore src/AroMotion.App/AroMotion.App.csproj -r win-x64 -p:EnableWindowsTargeting=true

      - name: Publish self-contained AROMOTION
        run: >-
          dotnet publish src/AroMotion.App/AroMotion.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:EnableWindowsTargeting=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/AROMOTION-win-x64

      - name: Download static FFmpeg + FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
          Expand-Archive $zip $extract -Force
          $ffmpeg = Get-ChildItem $extract -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $extract -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg binaries were not found.' }
          $target = 'artifacts/AROMOTION-win-x64/tools/ffmpeg'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $ffmpeg.FullName (Join-Path $target 'ffmpeg.exe')
          Copy-Item $ffprobe.FullName (Join-Path $target 'ffprobe.exe')

      - name: Add no-admin test instructions
        shell: pwsh
        run: |
          @'
          AROMOTION TEST BUILD — NO ADMIN RIGHTS REQUIRED

          1. Extract this ZIP anywhere you can write, for example Downloads\AROMOTION-Test.
          2. Double-click AROMOTION.exe.
          3. Keep the tools folder beside AROMOTION.exe.
          4. Record a short 15–30 second test with several clicks.
          5. Stop, then click Open Motion Editor.
          6. Test drag/resize zoom blocks, 3D presets/keyframes, cursor effects,
             spotlight, privacy blur, then Render preview.

          This build is self-contained and does not require Administrator rights.
          '@ | Set-Content 'artifacts/AROMOTION-win-x64/TEST-NO-ADMIN.txt' -Encoding UTF8

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AROMOTION-motion-effects-win-x64
          path: artifacts/AROMOTION-win-x64
          if-no-files-found: error
          compression-level: 6
