name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/AroMotion.App/AroMotion.App.csproj

      - name: Build
        run: dotnet build src/AroMotion.App/AroMotion.App.csproj -c Release --no-restore

      - name: Publish Windows x64 development build
        run: dotnet publish src/AroMotion.App/AroMotion.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/AROMOTION-win-x64

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: AROMOTION-win-x64
          path: artifacts/AROMOTION-win-x64
          if-no-files-found: error
