name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Windows x64
        run: dotnet restore src/AroMotion.App/AroMotion.App.csproj -r win-x64 -p:EnableWindowsTargeting=true

      - name: Publish portable Windows build
        run: >-
          dotnet publish src/AroMotion.App/AroMotion.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:EnableWindowsTargeting=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/AROMOTION-win-x64

      - name: Add quick setup files
        shell: bash
        run: |
          cp scripts/Setup-AROMOTION.ps1 artifacts/AROMOTION-win-x64/Setup-AROMOTION.ps1
          cp scripts/START.cmd artifacts/AROMOTION-win-x64/START.cmd
          cp QUICKSTART.md artifacts/AROMOTION-win-x64/QUICKSTART.md

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AROMOTION-win-x64-portable
          path: artifacts/AROMOTION-win-x64
          if-no-files-found: error
          compression-level: 6
